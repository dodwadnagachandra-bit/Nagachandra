# yocto/meta-ems/conf/machine/am65xx-ems.conf
# Custom MACHINE configuration for Advantech ECU-1170-552A
# Extends the TI AM65xx EVM reference board config from meta-ti-bsp
#
# NOTE: Exact DTB selection and U-Boot defconfig depend on the Advantech BSP for the
# ECU-1170-552A. The am65xx-evm base is a starting point. Hardware-specific DTB and
# bootloader configuration will be validated in Phase 29 (hardware bring-up).
# Contact Advantech for ECU-1170 Yocto BSP package or refer to adv-ti-yocto-bsp.

# Inherit TI AM65xx EVM base configuration (from meta-ti-bsp)
require conf/machine/am65xx-evm.conf

# ECU-1170 uses ttyS2 at 115200 baud for the primary debug console
# (Advantech ECU-1170-552A UART header: UART2 = ttyS2)
SERIAL_CONSOLES = "115200;ttyS2"

# U-Boot machine target — starting point from TI AM65xx EVM A53 core
# TODO (Phase 29): Confirm correct defconfig with Advantech BSP or U-Boot source
UBOOT_MACHINE = "am65x_evm_a53_defconfig"

# Machine features: ext4 rootfs, vFAT boot partition, EFI firmware support
MACHINE_FEATURES:append = " ext4 vfat efi"

# Default image types: ext4 for rootfs A/B partitions, wic for full eMMC image
IMAGE_FSTYPES ?= "ext4 wic"

# Kernel device tree — starts with TI base board DTB
# TODO (Phase 29): Replace with ECU-1170 specific DTB once Advantech BSP is available
KERNEL_DEVICETREE ?= "ti/k3-am654-base-board.dtb"
