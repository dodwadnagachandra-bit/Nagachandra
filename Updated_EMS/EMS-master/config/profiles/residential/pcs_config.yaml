# pcs_config.yaml — PCS Communication Configuration (Residential Profile)
# Schema: config/schemas/pcs_config.schema.json
# This file configures Modbus communication with the Power Conversion System (PCS).
# Protocol: Modbus RTU over RS485 (standard for residential installations).
#
# NOTE: If switching to Modbus TCP (rare, used with some commercial PCS units),
# replace the RTU-specific fields (device, baud_rate, parity, stopbits) with
# TCP-specific fields (host, port). The schema enforces this conditional.

_schema_version: "1.0"

connection:
  # Modbus transport protocol.
  # Valid values: rtu | tcp
  # Required.
  # Residential profile uses TCP for development (connects to modbus_sim on :5020).
  # For production with real PCS hardware, change to "rtu" and set device/baud_rate/parity.
  protocol: "tcp"

  # Modbus slave/unit ID of the PCS device.
  # Valid range: 1 to 247
  # Required.
  slave_id: 1

  # TCP host for Modbus TCP connection.
  # Required when protocol = tcp.
  host: "127.0.0.1"

  # TCP port for Modbus TCP connection.
  # Must match the modbus_sim --tcp-port (default 5020).
  # Required when protocol = tcp.
  port: 5020

# Path to the PCS Modbus register map definition (synthetic V1.24).
register_map_path: "config/pcs_register_map.yaml"

registers:
  # Modbus register for active power setpoint command.
  # PCS V1.24 register map: 0x500E (decimal 20494).
  # Write in kW * 10 (e.g., write 1000 for 100 kW).
  # Positive = charge, negative = discharge (sign convention per PCS manual).
  # Required.
  power_setpoint: 0x500E

  # Modbus register for PCS on/off control.
  # PCS V1.24 register map: 0x0291 (decimal 657).
  # Write 1 to start PCS, 0 to stop. Ensure E-Stop is not active before writing 1.
  # Required.
  on_off_control: 0x0291

  # Modbus register for AC voltage readback (RMS, line-to-line or line-to-neutral
  # per PCS V1.24 documentation).
  # Required.
  voltage_read: 0x0001

  # Modbus register for AC current readback (RMS).
  # Required.
  current_read: 0x0002

  # Modbus register for AC frequency readback.
  # Required.
  frequency_read: 0x0003

timing:
  # How often to poll PCS Modbus registers.
  # 500 ms gives 2 Hz control feedback loop.
  # Valid range: 100 to 5000
  # Unit: ms
  # Required.
  poll_interval_ms: 500

  # Modbus request timeout. If no response within this window, the request
  # is retried up to retry_count times before raising a fault.
  # Valid range: 500 to 10000
  # Unit: ms
  # Required.
  timeout_ms: 3000

  # Number of retry attempts for failed Modbus requests before declaring fault.
  # Valid range: 0 to 10
  # Unit: count
  # Required.
  retry_count: 3
