# PV Configuration — Residential Profile (50 kWh class)
# Solar PV inverter via Modbus RTU on RS485-3 for solar generation monitoring
# Validates against: config/schemas/pv_config.schema.json

_schema_version: "1.0"

connection:
  protocol: rtu            # Modbus transport: 'rtu' (RS485) or 'tcp' (Ethernet)
  slave_id: 5              # Modbus slave ID [1-247]; PV inverter is typically slave 5
  device: /dev/ttyUSB3     # RS485 serial port — RS485-4 on ECU-1170-552A (shared bus)
  baud_rate: 9600          # Serial baud rate [bps]; must match inverter hardware config
  parity: "N"              # Serial parity: N=None, E=Even, O=Odd
  stopbits: 1              # Stop bits: 1 (standard)

inverter:
  rated_power_kw: 10       # Inverter rated AC output power [kW]; residential rooftop PV
                           # Valid: minimum 1 kW; must match nameplate AC rating
  mppt_count: 2            # Number of MPPT input channels [count]: 2 for residential
                           # Valid: 1-12; each channel connects to a separate PV string

timing:
  poll_interval_ms: 1000   # Poll inverter registers every 1s [ms] for solar generation
  timeout_ms: 3000         # Modbus request timeout [ms]; 500-10000ms valid
