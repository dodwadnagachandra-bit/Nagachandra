# Control Manager Configuration — Residential Profile (50 kWh class)
# Hot-reloadable: changes take effect without service restart
# Validates against: config/schemas/control_config.schema.json

_schema_version: "1.0"

soc_limits:
  charge_cutoff_pct: 95    # Stop charging when SOC reaches this [%]; range: 80-100%
                           # 95% preserves top-end capacity without stress risk
  discharge_cutoff_pct: 10 # Stop discharging when SOC falls to this [%]; range: 0-30%
                           # 10% protects against deep discharge at residential scale

power_limits:
  max_charge_kw: 25        # Maximum charge power command to PCS [kW]; min: 0 kW
                           # 25 kW matches residential PCS rated charge power
  max_discharge_kw: 25     # Maximum discharge power command to PCS [kW]; min: 0 kW
                           # 25 kW matches residential PCS rated discharge power

source_priority:
  day_order:               # Daytime dispatch priority (solar available)
    - solar                # 1st: use solar generation first
    - grid                 # 2nd: draw from grid if solar insufficient
    - bess                 # 3rd: discharge BESS for peak shaving
    - dg                   # 4th: start generator as last resort
  night_order:             # Nighttime dispatch priority (no solar)
    - grid                 # 1st: use grid supply
    - bess                 # 2nd: discharge BESS for peak shaving / TOU arbitrage
    - dg                   # 3rd: generator backup

derating:
  bms_high_start_c: 40     # Begin derating above 40°C [°C]
  bms_high_cutoff_c: 50    # Zero power at 50°C [°C]
  pcs_high_start_c: 65     # Begin derating above 65°C [°C]
  pcs_high_cutoff_c: 80    # Zero power at 80°C [°C]
  bms_low_start_c: 5       # Begin derating below 5°C [°C]
  bms_low_cutoff_c: 0      # Zero power at 0°C [°C]

ramping:
  charge_ramp_kw_s: 5.0    # Maximum charge setpoint change rate [kW/s]
  discharge_ramp_kw_s: 5.0 # Maximum discharge setpoint change rate [kW/s]

state_machine:
  loop_interval_ms: 1000   # Control loop execution interval [ms]; range: 500-2000ms
                           # 1000ms = 1Hz control rate; structural — requires restart to change
  fault_retry_count: 3     # Retry count before protection trip [count]; range: 0-10
                           # 3 retries allows transient faults to self-clear
