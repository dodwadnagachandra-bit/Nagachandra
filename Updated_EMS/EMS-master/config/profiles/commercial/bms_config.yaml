# bms_config.yaml — BMS Communication Configuration (Commercial Profile)
# Schema: config/schemas/bms_config.schema.json
# CAN 2.0B at 500kbps — same interface parameters as residential, different topology

_schema_version: "1.0"

can:
  # CAN network interface name.
  # Use 'can0' for physical hardware; 'vcan0' for development/simulation.
  interface: "vcan0"

  # CAN bus bitrate [bps]; valid: 250000, 500000, 1000000
  bitrate: 500000

  # CAN FD mode — false unless BMS hardware supports CAN FD
  fd_enabled: false

  # Path to DBC file for CAN message decoding
  dbc_path: "config/bms_layer2.dbc"

  # Base CAN arbitration ID for BMU master; slaves computed as base_id + offset
  base_id: 0x98FF0003

timing:
  # Fast message polling interval [ms]; range: 100-1000ms
  fast_cycle_ms: 300

  # Slow message polling interval [ms]; range: 1000-5000ms
  slow_cycle_ms: 2000

  # BMS communication timeout [ms]; range: 1000-30000ms
  timeout_ms: 5000
