# pcs_config.yaml — PCS Communication Configuration (Commercial Profile)
# Schema: config/schemas/pcs_config.schema.json
# Commercial 500 kWh class — same Modbus RTU protocol, higher power PCS

_schema_version: "1.0"

connection:
  protocol: "rtu"           # Modbus transport: 'rtu' (RS485) or 'tcp' (Ethernet)
  slave_id: 1               # Modbus slave ID [1-247]; PCS is typically slave 1
  device: "/dev/ttyUSB0"    # RS485-1 serial port on ECU-1170-552A
  baud_rate: 9600           # Baud rate [bps]; 9600 matches PCS V1.24 default
  parity: "N"               # Parity: N=None (8N1 standard for this PCS)
  stopbits: 1               # Stop bits: 1 (standard)

register_map_path: "config/pcs_register_map.yaml"  # Synthetic V1.24 register map

registers:
  power_setpoint: 0x500E    # PCS V1.24 register for power setpoint [kW*10]
  on_off_control: 0x0291    # PCS V1.24 register for on/off command (1=on, 0=off)
  voltage_read: 0x0001      # Register for AC voltage readback
  current_read: 0x0002      # Register for AC current readback
  frequency_read: 0x0003    # Register for AC frequency readback

timing:
  poll_interval_ms: 500     # Poll every 500ms [ms]; range: 100-5000ms (2Hz control)
  timeout_ms: 3000          # Request timeout [ms]; range: 500-10000ms
  retry_count: 3            # Retry count before fault [count]; range: 0-10
