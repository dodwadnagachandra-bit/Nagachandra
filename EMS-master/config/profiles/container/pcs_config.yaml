# pcs_config.yaml — PCS Communication Configuration (Container Profile)
# Schema: config/schemas/pcs_config.schema.json
# Container 6+ MWh class — same Modbus RTU parameters, 3 MW PCS

_schema_version: "1.0"

connection:
  protocol: "rtu"           # Modbus transport: 'rtu' (RS485) or 'tcp' (Ethernet)
  slave_id: 1               # Modbus slave ID [1-247]
  device: "/dev/ttyUSB0"    # RS485-1 serial port on ECU-1170-552A
  baud_rate: 9600           # Baud rate [bps]; 9600 matches PCS V1.24 default
  parity: "N"               # Parity: N=None
  stopbits: 1               # Stop bits: 1

register_map_path: "config/pcs_register_map.yaml"  # Synthetic V1.24 register map

registers:
  power_setpoint: 0x500E    # PCS V1.24: active power setpoint register [kW*10]
  on_off_control: 0x0291    # PCS V1.24: on/off control register (1=on, 0=off)
  voltage_read: 0x0001      # AC voltage readback register
  current_read: 0x0002      # AC current readback register
  frequency_read: 0x0003    # AC frequency readback register

timing:
  poll_interval_ms: 500     # Poll every 500ms [ms]; 2Hz control feedback
  timeout_ms: 3000          # Request timeout [ms]; range: 500-10000ms
  retry_count: 3            # Retry count before fault [count]
