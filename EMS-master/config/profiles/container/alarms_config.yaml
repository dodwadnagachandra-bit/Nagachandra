# alarms_config.yaml — Alarm Manager Configuration (Container Profile)
# Hot-reloadable: threshold changes take effect without service restart (IEC 62682)
# Schema: config/schemas/alarms_config.schema.json
# Note: Safety thresholds are cell-level — do not scale with system size

_schema_version: "1.0"

defaults:
  hysteresis_pct: 2         # Default hysteresis [%]; range: 0-10%
  delay_ms: 5000            # Default alarm activation delay [ms]; range: 0-30000ms

rules:
  cell_voltage_high:
    signal: bms.cell_voltage_max
    severity: warning
    high_threshold: 3.65    # LFP overcharge threshold [V]
    enabled: true

  cell_voltage_low:
    signal: bms.cell_voltage_min
    severity: protection
    low_threshold: 2.8      # LFP deep discharge threshold [V]
    enabled: true

  cell_temp_high:
    signal: bms.cell_temp_max
    severity: action
    high_threshold: 45      # High temp action threshold [°C]
    enabled: true

  cell_temp_low:
    signal: bms.cell_temp_min
    severity: action
    low_threshold: 0        # Low temp action threshold [°C]
    enabled: true

  soc_high:
    signal: bms.soc_pct
    severity: warning
    high_threshold: 98      # SOC high warning [%]
    enabled: true

  soc_low:
    signal: bms.soc_pct
    severity: protection
    low_threshold: 5        # SOC low protection [%]
    enabled: true

  pcs_overtemp:
    signal: pcs.internal_temp_c
    severity: action
    high_threshold: 75      # PCS overtemperature threshold [°C]
    enabled: true

  bus_voltage_high:
    signal: bms.bus_voltage_v
    severity: protection
    high_threshold: 600     # DC bus overvoltage threshold [V]
    enabled: true

  bus_voltage_low:
    signal: bms.bus_voltage_v
    severity: protection
    low_threshold: 400      # DC bus undervoltage threshold [V]
    enabled: true
