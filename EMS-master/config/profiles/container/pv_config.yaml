# pv_config.yaml — Solar PV Inverter Configuration (Container Profile)
# Schema: config/schemas/pv_config.schema.json
# Container 6+ MWh class — 2000 kW PV array with 12 MPPT channels

_schema_version: "1.0"

connection:
  protocol: rtu             # Modbus transport: 'rtu' (RS485) or 'tcp' (Ethernet)
  slave_id: 5               # Modbus slave ID [1-247]
  device: /dev/ttyUSB3      # RS485-4 serial port on ECU-1170-552A
  baud_rate: 9600           # Baud rate [bps]; must match inverter hardware
  parity: "N"               # Parity: N=None
  stopbits: 1               # Stop bits: 1

inverter:
  rated_power_kw: 2000      # Rated AC output power [kW]; large-scale PV array
  mppt_count: 12            # Maximum MPPT channels [count]; range: 1-12
                            # 12 channels for large multi-string PV installation

timing:
  poll_interval_ms: 1000    # Poll every 1s [ms] for solar generation monitoring
  timeout_ms: 3000          # Request timeout [ms]; range: 500-10000ms
