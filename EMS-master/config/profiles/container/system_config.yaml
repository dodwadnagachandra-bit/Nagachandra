# system_config.yaml — EMS System Configuration (Container Profile)
# Schema: config/schemas/system_config.schema.json
# Large scale: 4 clusters, 16 racks/cluster, 20 modules/rack, 108 cells, 40 temps (6+ MWh class)

_schema_version: "1.0"

system:
  # Unique site identifier used in telemetry, MQTT topics, and cloud data.
  site_id: "CNT-001"

  # Human-readable name for this site.
  site_name: "Container Demo"

  # EMS firmware version in semver format.
  firmware_version: "0.1.0"

  # Deployment scale tier: residential | commercial | container
  model: "container"

topology:
  # Number of independent battery clusters [count]; range: 1-8
  cluster_count: 4           # Container: 4 clusters for 6+ MWh class

  # Number of BMU rack slave units per cluster [count]; range: 1-16
  racks_per_cluster: 16      # 16 racks × 4 clusters = 64 racks total

  # Number of LMU battery modules per rack [count]; range: 3-20
  modules_per_rack: 20       # Maximum modules per rack for high-density pack

  # Number of series-connected cells per battery module [count]; range: 16-108
  cells_per_module: 108      # 108 cells per module (large form-factor module)

  # Number of NTC temperature sensors per battery module [count]; range: 4-40
  temps_per_module: 40       # 40 temperature sensors per module for container thermal monitoring

subsystems:
  has_dg: true
  has_pv: true
  has_btms: true
  has_meter: true
