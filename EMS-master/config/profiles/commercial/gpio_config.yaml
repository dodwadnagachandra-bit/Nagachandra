# gpio_config.yaml — GPIO Safety I/O Configuration (Commercial Profile)
# Schema: config/schemas/gpio_config.schema.json
# Same pin assignments as residential — safety requirements don't change with scale

_schema_version: "1.0"

digital_inputs:
  DI-0:
    name: ACDB_FEEDBACK
    description: ACDB main contactor auxiliary contact — high=closed, low=open
    active_low: false
    debounce_ms: 20

  DI-1:
    name: FLOOD_SENSOR
    description: Water sensor in battery cabinet base — high=water detected
    active_low: false
    debounce_ms: 50

  DI-2:
    name: DOOR_SWITCH
    description: Magnetic reed switch on cabinet door — low=door open (NC contact)
    active_low: true
    debounce_ms: 20

  DI-3:
    name: SMOKE_DETECTOR
    description: Photoelectric smoke detector — high=smoke detected
    active_low: false
    debounce_ms: 0

  DI-4:
    name: HEAT_DETECTOR
    description: Fixed-temperature heat detector — high=temperature threshold exceeded
    active_low: false
    debounce_ms: 0

  DI-5:
    name: SPARE_DI5
    description: Spare input — available for site-specific safety sensor
    active_low: false
    debounce_ms: 20

  DI-6:
    name: ESTOP_NO
    description: E-Stop dual-channel Channel 1 (NO contact) — high=E-Stop activated
    active_low: false
    debounce_ms: 5

  DI-7:
    name: ESTOP_NC
    description: E-Stop dual-channel Channel 2 (NC contact) — low=E-Stop activated
    active_low: true
    debounce_ms: 5

digital_outputs:
  DO-0:
    name: ACDB_TRIP
    description: Trips ACDB main contactor to isolate AC grid from BESS
    active_low: false
    initial_state: low

  DO-1:
    name: EXTINGUISHER
    description: Activates automatic fire suppression system
    active_low: false
    initial_state: low

  DO-2:
    name: WARNING_LAMP
    description: Amber warning lamp on cabinet — active for warning-level alarms
    active_low: false
    initial_state: low

  DO-3:
    name: RUNNING_LAMP
    description: Green running lamp — active when EMS is operational and healthy
    active_low: false
    initial_state: low

  DO-4:
    name: FAULT_LAMP
    description: Red fault lamp — active for fault/protection-level conditions
    active_low: false
    initial_state: low

  DO-5:
    name: PCS_STOP
    description: Hardware stop signal to PCS — trips PCS independent of Modbus
    active_low: false
    initial_state: low

  DO-6:
    name: SIREN
    description: Audible alarm siren for safety events
    active_low: false
    initial_state: low

  DO-7:
    name: SPARE_DO7
    description: Spare output — available for site-specific actuator
    active_low: false
    initial_state: low
