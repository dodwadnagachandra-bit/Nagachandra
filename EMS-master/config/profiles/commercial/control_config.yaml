# control_config.yaml — Control Manager Configuration (Commercial Profile)
# Hot-reloadable: changes take effect without service restart
# Schema: config/schemas/control_config.schema.json
# Commercial 500 kWh class — 250 kW charge/discharge power limits

_schema_version: "1.0"

soc_limits:
  charge_cutoff_pct: 95     # Stop charging at 95% SOC [%]; range: 80-100%
  discharge_cutoff_pct: 10  # Stop discharging at 10% SOC [%]; range: 0-30%

power_limits:
  max_charge_kw: 250        # Maximum charge power [kW]; commercial PCS rated capacity
  max_discharge_kw: 250     # Maximum discharge power [kW]; commercial PCS rated capacity

source_priority:
  day_order:                # Daytime dispatch priority (solar available)
    - solar                 # 1st: solar generation
    - grid                  # 2nd: grid supply
    - bess                  # 3rd: BESS discharge for peak shaving
    - dg                    # 4th: generator backup
  night_order:              # Nighttime dispatch priority
    - grid                  # 1st: grid supply
    - bess                  # 2nd: BESS discharge
    - dg                    # 3rd: generator backup

derating:
  bms_high_start_c: 40      # Begin derating above 40°C [°C]
  bms_high_cutoff_c: 50     # Zero power at 50°C [°C]
  pcs_high_start_c: 65      # Begin derating above 65°C [°C]
  pcs_high_cutoff_c: 80     # Zero power at 80°C [°C]
  bms_low_start_c: 5        # Begin derating below 5°C [°C]
  bms_low_cutoff_c: 0       # Zero power at 0°C [°C]

ramping:
  charge_ramp_kw_s: 50.0    # Maximum charge setpoint change rate [kW/s]; commercial scale
  discharge_ramp_kw_s: 50.0 # Maximum discharge setpoint change rate [kW/s]

state_machine:
  loop_interval_ms: 1000    # Control loop interval [ms]; range: 500-2000ms; structural
  fault_retry_count: 3      # Fault retry count [count]; range: 0-10
