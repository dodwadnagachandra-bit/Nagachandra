# network_config.yaml — Network Configuration (Commercial Profile)
# Schema: config/schemas/network_config.schema.json
# Commercial 500 kWh class — static addresses for both interfaces

_schema_version: "1.0"

interfaces:
  eth0:
    mode: static              # Static IP for reliable cloud connectivity
    address: 10.0.1.10        # Static IPv4 address on WAN network
    netmask: 255.255.255.0    # Subnet mask — /24
    gateway: 10.0.1.1         # Default gateway
    dns:
      - 8.8.8.8               # Primary DNS
      - 8.8.4.4               # Secondary DNS

  eth1:
    mode: static              # Static IP for consistent device LAN addressing
    address: 192.168.2.1      # Device LAN gateway address
    netmask: 255.255.255.0    # Subnet mask — /24
    gateway: 192.168.2.254    # LAN gateway (upstream switch)
    dns:
      - 192.168.2.254         # Internal DNS for LAN devices
