# btms_config.yaml — BTMS Communication Configuration (Commercial Profile)
# Schema: config/schemas/btms_config.schema.json
# Commercial 500 kWh class — liquid cooling for higher thermal load

_schema_version: "1.0"

connection:
  protocol: rtu             # Modbus transport: 'rtu' (RS485) or 'tcp' (Ethernet)
  slave_id: 2               # Modbus slave ID [1-247]
  device: /dev/ttyUSB1      # RS485-2 serial port on ECU-1170-552A
  baud_rate: 9600           # Baud rate [bps]; must match BTMS hardware
  parity: "N"               # Parity: N=None
  stopbits: 1               # Stop bits: 1

device:
  mode: liquid              # Thermal mode: 'liquid' cooling for commercial thermal load
  setpoint_temp_c: 25       # Target temperature [°C]; range: 15-35°C

timing:
  poll_interval_ms: 2000    # Poll every 2s [ms]; range: 500-5000ms
  timeout_ms: 3000          # Request timeout [ms]; range: 500-10000ms
