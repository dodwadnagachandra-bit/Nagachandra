# cloud_config.yaml — Cloud Manager Configuration (Commercial Profile)
# Schema: config/schemas/cloud_config.schema.json
# Commercial 500 kWh class — higher telemetry frequency, larger buffer

_schema_version: "1.0"

broker:
  host: mqtt.revx-energy.com  # MQTT broker hostname
  port: 8883                  # MQTT over TLS port [port]
  protocol: mqtts             # Transport: mqtts (TLS required)

auth:
  method: mtls                                     # mTLS required for production
  ca_cert_path: /etc/ems/certs/ca.crt
  client_cert_path: /etc/ems/certs/device.crt
  client_key_path: /etc/ems/certs/device.key

telemetry:
  interval_s: 30              # Publish every 30s [s] for commercial monitoring granularity
  topic_prefix: ems/COM-001   # MQTT topic prefix; must match cloud registration

offline_buffer:
  enabled: true
  max_hours: 48               # 48h buffer [h] for commercial SLA compliance
  max_mb: 200                 # 200 MB buffer [MB] for higher data rate
