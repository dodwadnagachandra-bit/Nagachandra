# pv_config.yaml — Solar PV Inverter Configuration (Commercial Profile)
# Schema: config/schemas/pv_config.schema.json
# Commercial 500 kWh class — 200 kW PV array with 6 MPPT channels

_schema_version: "1.0"

connection:
  protocol: rtu             # Modbus transport: 'rtu' (RS485) or 'tcp' (Ethernet)
  slave_id: 5               # Modbus slave ID [1-247]
  device: /dev/ttyUSB3      # RS485-4 serial port on ECU-1170-552A
  baud_rate: 9600           # Baud rate [bps]; must match inverter hardware
  parity: "N"               # Parity: N=None
  stopbits: 1               # Stop bits: 1

inverter:
  rated_power_kw: 200       # Rated AC output power [kW]; minimum: 1 kW
  mppt_count: 6             # MPPT channel count [count]; range: 1-12
                            # 6 channels for commercial multi-string PV array

timing:
  poll_interval_ms: 1000    # Poll every 1s [ms] for solar generation data
  timeout_ms: 3000          # Request timeout [ms]; range: 500-10000ms
