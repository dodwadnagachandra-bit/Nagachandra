# meter_config.yaml — Energy Meter Configuration (Commercial Profile)
# Schema: config/schemas/meter_config.schema.json
# Commercial 500 kWh class — higher CT ratio for larger service connection

_schema_version: "1.0"

connection:
  protocol: rtu             # Modbus transport: 'rtu' (RS485) or 'tcp' (Ethernet)
  slave_id: 3               # Modbus slave ID [1-247]
  device: /dev/ttyUSB2      # RS485-3 serial port on ECU-1170-552A
  baud_rate: 9600           # Baud rate [bps]; must match meter hardware
  parity: "N"               # Parity: N=None
  stopbits: 1               # Stop bits: 1

device:
  model: schneider           # Meter model: 'acrel', 'schneider', 'abb', or 'generic'
  ct_ratio: 1000             # CT ratio [ratio]: 1000 = 1000A:1A CT for commercial service

timing:
  poll_interval_ms: 1000    # Poll every 1s [ms]; 1Hz for energy accounting
  timeout_ms: 3000          # Request timeout [ms]; range: 500-10000ms
