# DG Configuration — Residential Profile (50 kWh class)
# Diesel generator via Modbus RTU on RS485-3 for backup power
# Validates against: config/schemas/dg_config.schema.json

_schema_version: "1.0"

connection:
  protocol: rtu            # Modbus transport: 'rtu' (RS485) or 'tcp' (Ethernet)
  slave_id: 4              # Modbus slave ID [1-247]; DG controller is typically slave 4
  device: /dev/ttyUSB3     # RS485 serial port — RS485-4 on ECU-1170-552A
  baud_rate: 9600          # Serial baud rate [bps]; must match DG controller config
  parity: "N"              # Serial parity: N=None, E=Even, O=Odd
  stopbits: 1              # Stop bits: 1 (standard)

generator:
  rated_power_kw: 10       # Generator rated output power [kW]; residential backup gen
                           # Valid: minimum 1 kW; must match nameplate rating
  fuel_type: diesel        # Fuel type: 'diesel' or 'gas'; affects consumption logging
  auto_start: false        # Auto-start on grid failure: false for residential
                           # Manual start required — prevents unattended gen operation

timing:
  poll_interval_ms: 2000   # Poll generator registers every 2s [ms]; 500-5000ms valid
  timeout_ms: 3000         # Modbus request timeout [ms]; 500-10000ms valid
