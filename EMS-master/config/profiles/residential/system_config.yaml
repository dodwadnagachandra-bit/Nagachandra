# system_config.yaml — EMS System Configuration (Residential Profile)
# Schema: config/schemas/system_config.schema.json
# This file defines site identity and battery topology.
# All topology values must match the actual physical hardware installed.

_schema_version: "1.0"

system:
  # Unique site identifier used in telemetry, MQTT topics, and cloud data.
  # Format: {TIER}-{NUMBER}, e.g., RES-001, COM-042, CTR-001.
  # Required.
  site_id: "RES-001"

  # Human-readable name for this site. Displayed in the HMI and dashboards.
  # Required.
  site_name: "Residential Demo"

  # EMS firmware version in semver format.
  # Updated automatically by the OTA manager on firmware upgrades.
  # Optional.
  firmware_version: "0.1.0"

  # Deployment scale tier. Determines default parameter sets and HMI layout.
  # Valid values: residential | commercial | container
  # Required.
  model: "residential"

topology:
  # Number of independent battery clusters. Each cluster has its own BMU master unit.
  # Valid range: 1 to 8
  # Unit: count
  # Required.
  cluster_count: 1

  # Number of BMU rack slave units per cluster.
  # Valid range: 1 to 16
  # Unit: count
  # Required.
  racks_per_cluster: 4

  # Number of LMU battery modules per rack.
  # Valid range: 3 to 20
  # Unit: count
  # Required.
  modules_per_rack: 8

  # Number of series-connected cells per battery module.
  # Valid range: 16 to 108
  # Unit: count
  # Required.
  cells_per_module: 16

  # Number of NTC temperature sensors per battery module.
  # Valid range: 4 to 40
  # Unit: count
  # Required.
  temps_per_module: 8

subsystems:
  has_dg: false
  has_pv: false
  has_btms: true
  has_meter: true
