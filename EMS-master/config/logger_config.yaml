# Logger configuration -- telemetry persistence, event logging, and query settings.
# Validated against config/schemas/logger_config.schema.json
_schema_version: "1.0"

storage:
  data_dir: "/mnt/ssd/ems/data"           # SSD mount point for Parquet + JSONL
  parquet_retention_days: 90               # LOG-05: raw Parquet retention
  jsonl_retention_days: 180                # 2x Parquet (events are tiny ~100 KB/day)
  disk_usage_threshold_pct: 80             # LOG-06: FIFO cleanup trigger threshold
  cleanup_interval_s: 300                  # 5-minute cleanup timer

parquet:
  compression: "snappy"                    # LOG-08: CPU-light compression
  rotation_period_s: 3600                  # Hourly file rotation (LOG-02)
  row_group_size: 3600                     # One row group per file (1Hz x 1 hour)

query:
  socket: "ipc:///run/ems/logger_query.sock"
  time_series_max_rows: 10000
  time_series_timeout_s: 5
  latest_timeout_s: 1
  range_stats_timeout_s: 5
  event_log_max_rows: 1000
  event_log_timeout_s: 3
  energy_totals_timeout_s: 5
  cell_snapshot_timeout_s: 2
