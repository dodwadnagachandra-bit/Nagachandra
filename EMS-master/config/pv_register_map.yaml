# pv_register_map.yaml -- Synthetic Solar PV Inverter Modbus Register Map
# PV has no dedicated RTDB struct yet -- fields will be extended in a
# future milestone.
#
# Scale: raw_value = engineering_value * scale.
# Signed: true = two's complement int16, false = unsigned uint16.
# Access: r = read-only.

metadata:
  version: "synthetic-1.0"
  device_type: pv
  description: "Solar PV inverter register map"

registers:
  - address: 0x0001
    name: dc_voltage
    scale: 10
    unit: V
    access: r
    signed: false
    default: 3500
    description: "PV string DC voltage. Raw = V * 10."

  - address: 0x0002
    name: dc_current
    scale: 100
    unit: A
    access: r
    signed: false
    default: 0
    description: "PV string DC current. Raw = A * 100."

  - address: 0x0003
    name: dc_power
    scale: 10
    unit: kW
    access: r
    signed: false
    default: 0
    description: "DC power from PV. Raw = kW * 10."

  - address: 0x0004
    name: daily_energy
    scale: 10
    unit: kWh
    access: r
    signed: false
    default: 0
    description: "Daily energy generated. Raw = kWh * 10. Resets at midnight."
