# dg_register_map.yaml -- Synthetic Diesel Generator Modbus Register Map
# DG has no dedicated RTDB struct yet -- fields will map to system section
# or be extended in a future milestone.
#
# Scale: raw_value = engineering_value * scale.
# Signed: true = two's complement int16, false = unsigned uint16.
# Access: r = read-only.

metadata:
  version: "synthetic-1.0"
  device_type: dg
  description: "Diesel generator register map"

registers:
  - address: 0x0001
    name: voltage
    scale: 10
    unit: V
    access: r
    signed: false
    default: 2300
    description: "Output voltage RMS. Raw = V * 10."

  - address: 0x0002
    name: current
    scale: 100
    unit: A
    access: r
    signed: false
    default: 0
    description: "Output current RMS. Raw = A * 100."

  - address: 0x0003
    name: active_power
    scale: 10
    unit: kW
    access: r
    signed: false
    default: 0
    description: "Active power output. Raw = kW * 10."

  - address: 0x0004
    name: frequency
    scale: 100
    unit: Hz
    access: r
    signed: false
    default: 5000
    description: "Output frequency. Raw = Hz * 100."

  - address: 0x0005
    name: fuel_level
    scale: 10
    unit: "%"
    access: r
    signed: false
    default: 1000
    description: "Fuel tank level percentage. Raw = % * 10."

  - address: 0x0006
    name: runtime_hours
    scale: 1
    unit: h
    access: r
    signed: false
    default: 0
    description: "Cumulative runtime hours."
