# Schedule Configuration — Residential Profile (50 kWh class)
# Hot-reloadable: schedule changes take effect without service restart
# Validates against: config/schemas/schedule_config.schema.json

_schema_version: "1.0"

mode: time_of_day          # Scheduler mode: 'manual', 'time_of_day', or 'curve'
                           # time_of_day uses the time_windows array below

time_windows:
  - start: "06:00"         # Daytime discharge window: supply load from BESS
    end: "18:00"           # Window end time (HH:MM 24-hour format)
    action: discharge      # Action: 'charge', 'discharge', or 'idle'
    power_kw: 10           # Power setpoint [kW]; must be within control_config limits

  - start: "22:00"         # Off-peak charging window: charge from cheap grid power
    end: "06:00"           # Wraps to next day (22:00 to 06:00)
    action: charge
    power_kw: 15           # Charge at 15 kW during off-peak TOU rate

day_night:
  day_start: "06:00"       # Daytime begins at 06:00 — solar priority active (HH:MM)
  night_start: "18:00"     # Nighttime begins at 18:00 — grid/BESS priority

power_curve:               # 96-point daily power curve (15-min intervals, mode='curve')
  # Index 0=00:00, index 95=23:45. Positive=discharge [kW], negative=charge [kW]
  # Default: all zeros (idle) — edit for time-of-use optimization
  - 0   # 00:00
  - 0   # 00:15
  - 0   # 00:30
  - 0   # 00:45
