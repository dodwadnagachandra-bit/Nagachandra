_schema_version: "1.0"

# Timing intervals for the diagnostics module
intervals:
  publish_s: 60          # Publish diagnostic results on ZMQ PUB every N seconds
  trend_update_s: 3600   # Recompute historical trend metrics every N seconds (1 hour)

# Thresholds that trigger warnings or alerts
thresholds:
  soh_warning_pct: 85.0          # SOH below this value → warning alert
  soh_critical_pct: 80.0         # SOH below this value → critical alert (trigger get_predictions)
  pcs_efficiency_warning_pct: 90.0  # PCS efficiency below this → warning
  thermal_delta_warning_c: 8.0   # Cell max temp minus ambient delta above this → warning
  comm_fault_warning_rate: 5     # Comm faults per hour above this → warning

# Prediction / trend algorithm parameters
prediction:
  min_history_days: 7    # Minimum days of SOH data required before predictions are computed
  history_window_days: 30  # Days of history used for linear regression slope calculation

# Battery physical parameters (per installation)
battery:
  rated_capacity_ah: 100.0  # Rated cell capacity in Ah — used for coulomb-counting SOH

# Enable / disable individual diagnostic categories
# Allows sites without BTMS or PCS to suppress irrelevant diagnostics
metrics:
  soh_enabled: true
  pcs_efficiency_enabled: true
  thermal_enabled: true
  comm_health_enabled: true
  predictions_enabled: true
