# yocto/meta-ems/conf/layer.conf
# EMS custom Yocto layer — Advantech ECU-1170-552A (TI AM6548)
# Scarthgap (5.0 LTS) compatibility
# Source: https://docs.yoctoproject.org/dev-manual/layers.html

BBPATH .= ":${LAYERDIR}"

# Glob all recipes and bbappends under any recipes-*/<package>/ directory
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-ems"
BBFILE_PATTERN_meta-ems = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-ems = "10"

# Required layers: core (poky), meta-ti-bsp (TI AM65xx BSP), meta-oe and meta-python (extra recipes)
LAYERDEPENDS_meta-ems = "core meta-ti-bsp meta-oe meta-python"

# Compatible with Yocto Scarthgap 5.0 LTS (supported until April 2028)
LAYERSERIES_COMPAT_meta-ems = "scarthgap"
