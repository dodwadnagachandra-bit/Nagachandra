[project]
name = "ems-hmi-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ems-common",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "bcrypt>=4.0",
    "pyyaml>=6.0",
    "pyzmq>=27.1.0",
    "msgpack>=1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.uv.sources]
ems-common = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"
