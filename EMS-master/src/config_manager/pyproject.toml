[project]
name = "ems-config-manager"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ems-common",
    "jsonschema>=4.20",
    "pyyaml>=6.0",
    "pyzmq>=26.0",
    "inotify-simple>=1.3",
    "msgpack>=1.0",
]

[project.scripts]
ems-config = "ems_config_manager.cli:main"

[tool.uv.sources]
ems-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"
