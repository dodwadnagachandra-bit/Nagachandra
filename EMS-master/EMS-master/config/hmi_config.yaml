# HMI Server Configuration — Residential Profile (50 kWh class)
# React touchscreen HMI served by FastAPI hmi_server module
# Validates against: config/schemas/hmi_config.schema.json

_schema_version: "2.0"

server:
  http_port: 8080           # HTTP port for React frontend, REST API, and WebSocket connections [port]; range: 1024-65535
  host: "0.0.0.0"           # Bind address: "0.0.0.0" (all interfaces) or "127.0.0.1" (localhost only)

auth:
  operator_pin_hash: "$2b$12$FrJqEzlPuxMsNreVJ1621OaO8KzZsdnxkLHlSH2xqeipMpsdKr4Ra"   # bcrypt("1234")
  admin_pin_hash: "$2b$12$gea/xfaNNq3MjjKh7ZelcOEeTp3OawNdMV8o2/pVS38/TueGrMxKe"       # bcrypt("5678")
  session_timeout_s: 1800   # Auto-logout after 30 min inactivity [s]; range: 60-7200s

display:
  refresh_interval_ms: 1000  # Dashboard data refresh interval [ms]; range: 500-5000ms
                             # 1s refresh matches control_manager 1Hz update rate
  kiosk_mode: false          # Kiosk mode: false for development; true for dedicated touchscreen
  screen_size: "10inch"      # Screen size: "7inch", "10inch", or "15inch"
                             # Selects CSS breakpoint for UI layout
