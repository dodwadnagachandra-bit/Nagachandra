# Meter Configuration — Residential Profile (50 kWh class)
# Energy meter via Modbus RTU on RS485-2 measuring grid import/export
# Validates against: config/schemas/meter_config.schema.json

_schema_version: "1.0"

connection:
  protocol: rtu            # Modbus transport: 'rtu' (RS485) or 'tcp' (Ethernet)
  slave_id: 3              # Modbus slave ID [1-247]; meter is typically slave 3
  device: /dev/ttyUSB2     # RS485 serial port — RS485-3 on ECU-1170-552A
  baud_rate: 9600          # Serial baud rate [bps]; must match meter hardware config
  parity: "N"              # Serial parity: N=None, E=Even, O=Odd
  stopbits: 1              # Stop bits: 1 (standard)

device:
  model: acrel             # Meter model: 'acrel', 'schneider', 'abb', or 'generic'
                           # Selects correct register map for this hardware
  ct_ratio: 200            # Current transformer ratio [ratio]: 200 = 200A:1A CT
                           # Residential single-phase 200A service connection

timing:
  poll_interval_ms: 1000   # Poll meter registers every 1s [ms] for 1Hz energy data
  timeout_ms: 3000         # Modbus request timeout [ms]; 500-10000ms valid
