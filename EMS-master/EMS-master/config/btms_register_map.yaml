# btms_register_map.yaml -- Synthetic BTMS Modbus Register Map
# Maps to ems_btms_t RTDB struct fields: inlet_temp, outlet_temp,
# fan_speed_pct, cooling_active.
#
# Scale: raw_value = engineering_value * scale.
# Signed: true = two's complement int16, false = unsigned uint16.
# Access: r = read-only.

metadata:
  version: "synthetic-1.0"
  device_type: btms
  description: "Battery Thermal Management System register map"

registers:
  - address: 0x0001
    name: inlet_temp
    scale: 10
    unit: degC
    access: r
    signed: true
    default: 250
    description: "Coolant inlet temperature. Raw = degC * 10."

  - address: 0x0002
    name: outlet_temp
    scale: 10
    unit: degC
    access: r
    signed: true
    default: 280
    description: "Coolant outlet temperature. Raw = degC * 10."

  - address: 0x0003
    name: fan_speed_pct
    scale: 10
    unit: "%"
    access: r
    signed: false
    default: 0
    description: "Fan speed as percentage. Raw = % * 10."

  - address: 0x0004
    name: cooling_active
    scale: 1
    unit: ""
    access: r
    signed: false
    default: 0
    description: "Cooling system active flag. 0=inactive, 1=active."
