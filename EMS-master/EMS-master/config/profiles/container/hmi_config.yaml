# hmi_config.yaml — HMI Server Configuration (Container Profile)
# Schema: config/schemas/hmi_config.schema.json
# Container 6+ MWh class — dedicated kiosk with 15-inch touchscreen

_schema_version: "2.0"

server:
  http_port: 8080           # HTTP port for React frontend and REST API [port]
  host: "0.0.0.0"           # Bind all interfaces

auth:
  operator_pin_hash: "$2b$12$placeholder"   # bcrypt hash of operator PIN
  admin_pin_hash: "$2b$12$placeholder"       # bcrypt hash of admin PIN
  session_timeout_s: 900    # Session timeout: 15 min [s] for container security policy

display:
  refresh_interval_ms: 500   # Fast 500ms refresh [ms] for container grid dispatch monitoring
  kiosk_mode: true           # Kiosk mode: always enabled for container dedicated display
  screen_size: "15inch"      # Screen size: 15-inch industrial touchscreen
