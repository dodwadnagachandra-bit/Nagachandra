# cloud_config.yaml — Cloud Manager Configuration (Container Profile)
# Schema: config/schemas/cloud_config.schema.json
# Container 6+ MWh class — maximum buffer for grid dispatch compliance

_schema_version: "1.0"

broker:
  host: mqtt.revx-energy.com  # MQTT broker hostname
  port: 8883                  # MQTT over TLS port [port]
  protocol: mqtts             # Transport: mqtts (TLS required for all deployments)

auth:
  method: mtls                                     # mTLS required for production
  ca_cert_path: /etc/ems/certs/ca.crt
  client_cert_path: /etc/ems/certs/device.crt
  client_key_path: /etc/ems/certs/device.key

telemetry:
  interval_s: 10              # Publish every 10s [s] for grid dispatch responsiveness
  topic_prefix: ems/CNT-001   # MQTT topic prefix; must match cloud registration

offline_buffer:
  enabled: true
  max_hours: 168              # 7-day buffer [h] for grid contract compliance
  max_mb: 500                 # Maximum buffer [MB]; maximum allowed for container class
