# btms_config.yaml — BTMS Communication Configuration (Container Profile)
# Schema: config/schemas/btms_config.schema.json
# Container 6+ MWh class — liquid cooling for high thermal density

_schema_version: "1.0"

connection:
  protocol: rtu             # Modbus transport: 'rtu' (RS485) or 'tcp' (Ethernet)
  slave_id: 2               # Modbus slave ID [1-247]
  device: /dev/ttyUSB1      # RS485-2 serial port on ECU-1170-552A
  baud_rate: 9600           # Baud rate [bps]; must match BTMS hardware
  parity: "N"               # Parity: N=None
  stopbits: 1               # Stop bits: 1

device:
  mode: liquid              # Thermal mode: liquid cooling mandatory for container class
  setpoint_temp_c: 23       # Target temperature [°C]; range: 15-35°C
                            # 23°C for optimal container class cycle life

timing:
  poll_interval_ms: 1000    # Poll every 1s [ms] for tighter thermal control
  timeout_ms: 3000          # Request timeout [ms]; range: 500-10000ms
