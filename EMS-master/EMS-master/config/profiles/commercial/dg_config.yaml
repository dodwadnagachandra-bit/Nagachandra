# dg_config.yaml — Diesel Generator Configuration (Commercial Profile)
# Schema: config/schemas/dg_config.schema.json
# Commercial 500 kWh class — 100 kW generator with auto-start enabled

_schema_version: "1.0"

connection:
  protocol: rtu             # Modbus transport: 'rtu' (RS485) or 'tcp' (Ethernet)
  slave_id: 4               # Modbus slave ID [1-247]
  device: /dev/ttyUSB3      # RS485-4 serial port on ECU-1170-552A
  baud_rate: 9600           # Baud rate [bps]; must match DG controller
  parity: "N"               # Parity: N=None
  stopbits: 1               # Stop bits: 1

generator:
  rated_power_kw: 100       # Rated generator output [kW]; minimum: 1 kW
  fuel_type: diesel         # Fuel type: 'diesel' or 'gas'
  auto_start: true          # Auto-start on grid failure: true for commercial sites
                            # Commercial sites have UPS requirements for tenant loads

timing:
  poll_interval_ms: 2000    # Poll every 2s [ms]; range: 500-5000ms
  timeout_ms: 3000          # Request timeout [ms]; range: 500-10000ms
