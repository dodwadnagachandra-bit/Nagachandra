# hmi_config.yaml — HMI Server Configuration (Commercial Profile)
# Schema: config/schemas/hmi_config.schema.json
# Commercial 500 kWh class — 15-inch touchscreen, kiosk mode enabled

_schema_version: "2.0"

server:
  http_port: 8080           # HTTP port for React frontend and REST API [port]
  host: "0.0.0.0"           # Bind all interfaces

auth:
  operator_pin_hash: "$2b$12$placeholder"   # bcrypt hash of operator PIN
  admin_pin_hash: "$2b$12$placeholder"       # bcrypt hash of admin PIN
  session_timeout_s: 1800   # Session timeout: 30 min [s]; range: 60-7200s

display:
  refresh_interval_ms: 1000  # Dashboard refresh [ms]; range: 500-5000ms
  kiosk_mode: true           # Kiosk mode enabled for commercial dedicated display
  screen_size: "15inch"      # Screen size: commercial wall-mount 15-inch display
