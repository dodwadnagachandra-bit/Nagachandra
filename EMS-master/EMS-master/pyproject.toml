# pyproject.toml — uv workspace root
# Not an installable package; defines workspace and dev tooling.

[project]
name = "ems"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "src/common/python",
    "src/config_manager",
    "src/alarm_manager",
    "src/scheduler",
    "src/diagnostics",
    "src/cloud_manager",
    "src/ota_manager",
    "src/hmi_server",
    "src/comm_manager/python",
    "src/data_manager/python",
    "src/logger/python",
    "src/control_manager/python",
]

[dependency-groups]
dev = [
    "cantools>=39.0",
    "duckdb>=1.5.0",
    "jsonschema>=4.23",
    "msgpack>=1.0",
    "psutil>=7.2.2",
    "pyarrow>=23.0.1",
    "pymodbus>=3.7",
    "pytest>=8.0",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.4.0",
    "python-can>=4.0",
    "pyyaml>=6.0",
    "pyzmq>=27.1.0",
    "ruff>=0.9",
    "textual>=1.0",
    "websockets>=16.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
    "node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-m 'not integration and not slow and not rtu'"
markers = [
    "rtu: Modbus RTU tests requiring socat (deselect with: -m 'not rtu')",
    "gpio_sim: GPIO-sim kernel module tests (deselect with: -m 'not gpio_sim')",
    "integration: Integration tests requiring simulators (run with: make test-integration)",
    "slow: Long-running tests >5 minutes (run with: --runslow)",
    "hw: hardware validation tests requiring ECU connection (run with: uv run pytest tests/hw/)",
    "requires_simulator: hw tests requiring external Modbus/CAN simulators for full PASS",
]
