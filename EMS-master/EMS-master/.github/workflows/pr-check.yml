# .github/workflows/pr-check.yml
# Fast PR validation: build + test + lint — must complete in <5 min.
# Triggers on every pull request targeting master.
# All steps must pass before merge is allowed (enforce via branch protection).

name: PR Check

on:
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    name: Build, Test & Lint
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-format

      - name: Configure CMake (native Debug)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build C targets
        run: cmake --build build -- -j$(nproc)

      - name: Run C tests
        run: ctest --test-dir build --output-on-failure

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync --locked --all-extras --dev --all-packages

      - name: Validate config files
        run: uv run python tools/validate_config.py

      - name: Run Python tests
        run: uv run pytest tests/ -v -m "not integration"

      - name: Check C formatting (clang-format)
        run: find src -name "*.c" -o -name "*.h" | xargs clang-format --dry-run --Werror

      - name: Check Python lint (ruff)
        run: uv run ruff check src/

      - name: Check Python formatting (ruff)
        run: uv run ruff format --check src/

  integration-test:
    name: Integration Smoke Tests
    runs-on: ubuntu-22.04
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up vcan0
        run: |
          sudo modprobe vcan can can_raw
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync --locked --all-extras --dev --all-packages

      - name: Run integration tests
        run: uv run pytest tests/test_integration.py -v -m integration
