# .github/workflows/master-merge.yml
# Full CI suite on master merge: native build + ARM64 cross-compile + HMI build + all tests + lint.
# Triggers on every push to master (after PR merge or direct push).
# Produces verified ARM64 ELF binaries for the Advantech ECU-1170-552A (TI AM6548).

name: Master Merge

on:
  push:
    branches:
      - master

jobs:
  full-suite:
    name: Full Build, Cross-Compile & Test Suite
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (native + ARM64 cross-compiler)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            clang-format \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu

      # --- Native build and test ---

      - name: Configure CMake (native Debug)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build C targets (native)
        run: cmake --build build -- -j$(nproc)

      - name: Run C tests (native)
        run: ctest --test-dir build --output-on-failure

      # --- ARM64 cross-compilation ---

      - name: Configure CMake (ARM64 cross-compile, Release)
        run: |
          cmake -B build-arm \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/aarch64-linux.cmake \
            -DCMAKE_BUILD_TYPE=Release

      - name: Cross-compile for ARM64
        run: cmake --build build-arm -- -j$(nproc)

      - name: Verify ARM64 binary architecture
        run: |
          echo "=== Verifying ARM64 ELF binaries ==="
          for binary in safety_manager comm_manager_c data_manager_c logger_c control_manager_c; do
            echo -n "Checking build-arm/${binary}: "
            file build-arm/${binary} | grep -q "aarch64" && echo "PASS (aarch64 ELF)" || (echo "FAIL (not aarch64)"; exit 1)
          done
          echo "=== All 5 ARM64 binaries verified ==="

      # --- Python setup and tests ---

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync --locked --all-extras --dev --all-packages

      - name: Run Python tests
        run: uv run pytest tests/ -v

      # --- Lint and format checks ---

      - name: Check C formatting (clang-format)
        run: find src -name "*.c" -o -name "*.h" | xargs clang-format --dry-run --Werror

      - name: Check Python lint (ruff)
        run: uv run ruff check src/

      - name: Check Python formatting (ruff)
        run: uv run ruff format --check src/

      # --- HMI frontend build and test ---

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Install HMI dependencies
        working-directory: src/hmi_server/frontend
        run: bun install

      - name: Build HMI frontend (production)
        working-directory: src/hmi_server/frontend
        run: bun run build

      - name: Run HMI tests
        working-directory: src/hmi_server/frontend
        run: bun test
