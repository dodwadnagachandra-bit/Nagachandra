[project]
name = "ems-comm-manager"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ems-common",
    "pymodbus>=3.7",
    "pyserial>=3.5",
    "pyzmq>=26.0",
    "pyyaml>=6.0",
]

[tool.uv.sources]
ems-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"
