[project]
name = "ems-logger"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.0",
    "ems-common",
    "pyarrow>=23.0.1",
]

[tool.uv.sources]
ems-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
