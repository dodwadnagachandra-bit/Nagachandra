# deploy/tmpfiles/ems.conf
# systemd-tmpfiles configuration for EMS runtime directories.
#
# These directories are created at system startup by systemd-tmpfiles-setup.service,
# which runs before any EMS service starts.
#
# /run/ems is a tmpfs mount (declared in /etc/fstab via base-files bbappend).
# All ZMQ IPC sockets are created here by data_manager at startup.
#
# /data/* directories persist across reboots on the SSD NVMe partition.
# They are NOT recreated if they already exist (systemd-tmpfiles is idempotent).
#
# Format: type path mode user group age argument
# d = create directory if it doesn't exist

# ZMQ IPC socket directory — tmpfs, cleared on each reboot
d /run/ems                  0755  ems  ems  -

# SSD data directories — persistent storage on /dev/nvme0n1p1
d /data/config              0755  ems  ems  -
d /data/parquet             0755  ems  ems  -
d /data/jsonl               0755  ems  ems  -
d /data/cloud_buffer        0755  ems  ems  -
d /data/rtdb_snapshots      0755  ems  ems  -
