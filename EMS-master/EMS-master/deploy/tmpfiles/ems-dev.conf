# deploy/tmpfiles/ems-dev.conf
# systemd-tmpfiles configuration for EMS development.
#
# Creates /run/ems on boot with permissions for the 'ems' group,
# so the TUI and simulators can create ZMQ IPC sockets without sudo.
#
# Install: sudo cp deploy/tmpfiles/ems-dev.conf /etc/tmpfiles.d/ems-dev.conf
#          sudo systemd-tmpfiles --create /etc/tmpfiles.d/ems-dev.conf
#
# Format: type path mode user group age argument

d /run/ems 0775 root ems -
